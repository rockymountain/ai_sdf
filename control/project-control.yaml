risk:
  overall_status: attention_required
  open:
    - id: RISK-CTRL-001
      category: human_cognitive_load
      severity: high
      statement: >-
        The Factory still depends heavily on human and interactive AI reasoning
        for invariant discovery, architecture synthesis and semantic audit.
      treatment: >-
        Measure prospectively from DEV-008 and progressively automate
        low-leverage repeatable reasoning without removing human accountability.
      affects:
        - M2
        - M3
        - M4
        - M5
        - M6
    - id: RISK-CTRL-002
      category: interactive_ai_cost_visibility
      severity: medium
      statement: >-
        Interactive AI reasoning resource is not yet fully metered.
      treatment: >-
        Begin prospective session/review-cycle measurement and add exact
        usage/cost metrics when available.
    - id: RISK-CTRL-003
      category: timeline
      severity: medium
      statement: >-
        M3-M5 duration depends on measurement windows and experiment outcomes.
      treatment: >-
        Maintain range-based forecasts and reforecast from actual throughput.
      affects:
        - M3
        - M4
        - M5
        - M6
    - id: RISK-CTRL-004
      category: historical_measurement
      severity: low
      statement: >-
        Project-wide Phase-0 AI and human resource usage is incomplete.
      treatment: >-
        Preserve unknown history and improve measurement prospectively.
    - id: RISK-CTRL-005
      category: optimization
      severity: high
      statement: >-
        Optimizing executor tokens alone can hide high total human/reasoning
        delivery cost.
      treatment: >-
        Track human accountable and low-leverage effort alongside execution-agent
        economics.
  accepted: []
  closed: []

