control_position:
  current_phase:
    id: phase-1
    title: Prove bounded, cost-aware agent execution
    status: in_progress
  latest_completed_milestone:
    id: M2
    title: Bounded Autonomous Execution
  current_milestone:
    id: M3
    title: AI Cost Control Baseline
    status: in_progress
    actual_measurement_window: not_started
  intended_next_delivery:
    dev_task: null
    status: planned
  current_decision:
    change_owner: CTRL-CHANGE-012
    subject: separate the M4 context-effect KPI from delivery-accounting token totals
    status: complete
    disposition: delivered
    owner_acceptance:
      reference: OWNER-ACCEPT-CTRL-CHANGE-012-2026-09-25
      accepted_on: "2026-09-25"
    audit:
      independent_codex_verdict: ACCEPTED_WITH_NONBLOCKING_OBSERVATIONS
      material_blockers_remaining: false
    reason: >-
      With Claude and Codex both live as controlled adapters (CTRL-CHANGE-010) and
      corrected for runtime-version provenance (CTRL-CHANGE-011), reusing the
      existing all-attributable, mixed-provider delivery-accounting metric
      (input_tokens_per_accepted_dev) as if it were the non-canonical Phase-1
      plan's M4 Graphify/context-treatment gate would conflate two different
      questions and risk a wrong future M4 decision. T2 ADR-013 / DEV-019 /
      TEST-019 introduce a separately named, separately structured M4
      context-effect KPI (src/ai_execution/context_effect.py) with a predeclared
      accepted-DEV cohort, deterministic evidence-backed compatibility evaluation
      (observed model/runtime version, never requested model alone), and three
      independently represented signals: effect_metric_calculable,
      effect_gate_result (exact-arithmetic >= 70% threshold), and
      treatment_decision_eligible (requires a declared GuardrailContract, which
      this change does not populate with any real M4 guardrail set). Existing
      cost_baseline.py delivery-accounting metrics and REPORT_SCHEMA_VERSION are
      unmodified. No compatibility rule for any real Claude or OpenAI runtime
      version is shipped; only the deterministic mechanism, exercised by synthetic
      fixtures. AIRuntimePort, the gateway, controller, and operational schema are
      unchanged.
    measurement_status: PRE-WINDOW
    evidence:
      decisions:
        - ADR-013
      dev:
        - DEV-019
      verification:
        - TEST-019
  prior_delivered_decision:
    change_owner: CTRL-CHANGE-011
    subject: Claude runtime-version provenance correction
    status: complete
    disposition: delivered
    reason: >-
      An independent post-closure Codex audit of CTRL-CHANGE-010 found that
      production Claude execution did not record the runtime version required by
      accepted FR-006. A second independent Codex re-audit then found the first
      DEV-018 implementation itself violated accepted FR-007 reservation
      semantics; the correction moved version discovery inside
      ClaudeRuntimeAdapter.start(), reusing existing gateway/controller
      reservation-release machinery unchanged. The re-audit returned
      ACCEPTED_WITH_NONBLOCKING_OBSERVATIONS with no remaining blockers, and the
      Project Owner accepted the correction for closure. Historical Claude rows
      with runtime_version null remain immutable and are not backfilled.
    measurement_status: PRE-WINDOW
    evidence:
      dev:
        - DEV-018
      verification:
        - TEST-018
    previous:
      change_owner: CTRL-CHANGE-010
      subject: dual-runtime controlled execution and purpose-scoped M3 treatment
      status: complete
      disposition: delivered
      measurement_status: PRE-WINDOW
      post_closure_finding:
        source: independent_codex_audit
        finding: incomplete_claude_runtime_version_provenance
        correction_owner: CTRL-CHANGE-011
        correction_status: resolved
        historical_evidence_rewritten: false
  retained_deferred_decision:
    change_owner: CTRL-CHANGE-009
    subject: quality-gate family intent/design package
    disposition: deferred
    retained: true
    implementation_authority: false
  prospective_m3_fixed_set:
    status: not_yet_declared
    disposition: deferred
    candidate_lifecycle: proposed
    implementation_authority: false
    candidates:
      - DEV-014
      - DEV-015
      - DEV-016

