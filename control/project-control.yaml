      statement: >-
        The Factory still depends heavily on human and interactive AI reasoning
        for invariant discovery, architecture synthesis and semantic audit.
      treatment: >-
        Measure prospectively from DEV-008 and progressively automate
        low-leverage repeatable reasoning without removing human accountability.
      affects:
        - M2
        - M3
        - M4
        - M5
        - M6
    - id: RISK-CTRL-002
      category: interactive_ai_cost_visibility
      severity: medium
      statement: >-
        Interactive AI reasoning resource is not yet fully metered.
      treatment: >-
        Begin prospective session/review-cycle measurement and add exact
        usage/cost metrics when available.
    - id: RISK-CTRL-003
      category: timeline
      severity: medium
      statement: >-
        M3-M5 duration depends on measurement windows and experiment outcomes.
      treatment: >-
        Maintain range-based forecasts and reforecast from actual throughput.
      affects:
