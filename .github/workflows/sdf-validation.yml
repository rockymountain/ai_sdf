name: SDF Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Create isolated validation environment
        run: |
          python tools/check_environment.py --python-only
          python -m venv .venv
          .venv/bin/python -m pip --isolated install --only-binary=:all: -r requirements-dev.txt
          .venv/bin/python -m pip check
          .venv/bin/python tools/check_environment.py

      - name: Verify generated agent instructions
        run: .venv/bin/python tools/generate_agents.py --repo . --check

      - name: Canonical artifacts and QG-004 configuration
        run: .venv/bin/python tools/traceability/validate.py --repo .

      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tools/traceability/tests -v

      - name: PR provenance and base/proposed QG-004 evidence
        if: github.event_name == 'pull_request'
        run: >-
          .venv/bin/python tools/traceability/validate.py
          --repo .
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"
          --github-event "$GITHUB_EVENT_PATH"
